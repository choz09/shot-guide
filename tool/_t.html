<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>結果画像ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@1,700;1,800&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#323843;--ink:#e9e6df;--mute:#9aa1ad;--acc:#c9a24a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Yu Gothic UI","Hiragino Sans",sans-serif}
.wrap{display:grid;grid-template-columns:380px 1fr;gap:20px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h1{font-size:16px;margin:0 0 10px}
h2{font-size:12px;color:var(--mute);margin:16px 0 6px;letter-spacing:.05em}
label{display:block;margin:6px 0 2px;color:var(--mute);font-size:12px}
input[type=text]{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:#12141a;color:var(--ink);font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;color:var(--ink);cursor:pointer}
.seg input{display:none}
.seg span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:#12141a}
.seg input:checked+span{border-color:var(--acc);color:var(--acc);background:#251f10}
.row{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin:4px 0}
.row input{margin:0}
.sw{display:flex;gap:8px}
.sw div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.sw input{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
button{padding:11px 16px;border-radius:8px;border:0;background:var(--acc);color:#1a1405;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:14px}
input[type=file]{width:100%;color:var(--mute);font-size:12px}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{width:100%;max-width:640px;height:auto;border-radius:6px;background:#000;touch-action:none;cursor:grab}
.hint{color:var(--mute);font-size:12px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
  <h1>結果画像ツール(Instagram 4:5)</h1>

  <h2>① 告知画像(色を自動で拾う)</h2>
  <input type="file" id="fAnn" accept="image/*">
  <div class="sw" style="margin-top:8px">
    <div>背景<input type="color" id="cBg" value="#f5efe2"></div>
    <div>文字<input type="color" id="cInk" value="#1a1a1a"></div>
    <div>アクセント<input type="color" id="cAcc" value="#2f8f83"></div>
  </div>

  <h2>② デザインと種類</h2>
  <div class="seg" id="segLayout">
    <label><input type="radio" name="layout" value="A" checked><span>A フル写真</span></label>
    <label><input type="radio" name="layout" value="S"><span>S ステージ合成</span></label>
    <label><input type="radio" name="layout" value="B"><span>B フレーム</span></label>
  </div>
  <div class="seg" id="segKind" style="margin-top:8px">
    <label><input type="radio" name="kind" value="ft" checked><span>FT進出</span></label>
    <label><input type="radio" name="kind" value="win"><span>優勝写真</span></label>
  </div>
  <div class="seg hide" id="segN" style="margin-top:8px">
    <label><input type="radio" name="n" value="1" checked><span>優勝のみ</span></label>
    <label><input type="radio" name="n" value="2"><span>優勝+準優勝</span></label>
    <label><input type="radio" name="n" value="3"><span>3位まで</span></label>
  </div>

  <div id="sBox" class="hide">
    <h2>②-2 ステージ背景(Sのみ・初期は黒×金を内蔵)</h2>
    <input type="file" id="fBg" accept="image/*">
    <label>背景の色味を告知の色に寄せる(0=そのまま)</label>
    <input type="range" id="tint" min="0" max="0.6" step="0.02" value="0" style="width:100%">
    <label>切り抜き済みPNG(任意・透過。入れると自動切り抜きは使わない)</label>
    <input type="file" id="fCut" accept="image/png">
    <label><input type="checkbox" id="keepTable"> テーブルを写真から残す(チップ・トロフィー用。写真と切り抜きPNGの両方を入れる)</label>
    <label>テーブルの境界(写真の上から何%。人物の手前に来る位置)</label>
    <input type="range" id="tableY" min="30" max="95" step="1" value="62" style="width:100%">
    <label><input type="checkbox" id="ring" checked> イベント名を上のLEDリングに湾曲表示(内蔵背景用)</label>
    <label>リング文字の上下位置</label>
    <input type="range" id="ringY" min="-40" max="40" step="1" value="0" style="width:100%">
    <div class="hint" id="status">写真を入れると、人物を自動で切り抜きます(初回はモデル読込に時間がかかります)。</div>
  </div>

  <h2>③ 文字</h2>
  <label>イベント名</label><input type="text" id="tTitle" placeholder="例: Monthly Tournament">
  <label>サブ(任意)</label><input type="text" id="tSub" placeholder="例: Daily Tournament">
  <label>日付(月日のみ)</label><input type="text" id="tDate" placeholder="例: 11.14 SAT">
  <label>FT用の文言</label><input type="text" id="tFt" value="FINAL TABLE">
  <div id="names" class="hide">
    <div class="row"><input type="text" id="l0" value="優勝"><input type="text" id="n0" placeholder="名前"></div>
    <div class="row"><input type="text" id="l1" value="準優勝"><input type="text" id="n1" placeholder="名前"></div>
    <div class="row"><input type="text" id="l2" value="3位"><input type="text" id="n2" placeholder="名前"></div>
  </div>

  <h2>④ 写真(画像をドラッグで位置、下のバーで拡大)</h2>
  <input type="file" id="fPhoto" accept="image/*">
  <input type="range" id="zoom" min="0.5" max="3" step="0.01" value="1" style="width:100%">
  <label>ロゴ(任意・透過PNG推奨)</label><input type="file" id="fLogo" accept="image/*">

  <button id="dl">PNGで保存</button>
</div>

<div class="stage">
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div class="hint">プレビュー。写真をドラッグすると位置が動きます。</div>
</div>
</div>

<script>
const W=1080,H=1350;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const st={photo:null,photoFile:null,logo:null,bg:null,cut:null,cutFor:null,busy:false,zoom:1,dx:0,dy:0};
const BGREMOVE='https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';
function status(t){$('status').textContent=t}
const SERIF='"Playfair Display","Zen Old Mincho",serif';
const MINCHO='"Zen Old Mincho",serif';
const CINZEL='"Cinzel","Zen Old Mincho",serif';

function val(n){return document.querySelector('input[name='+n+']:checked').value}
function loadImg(file,cb){const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>cb(im);im.src=u}

/* ---- 色の抽出 ---- */
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const l=(mx+mn)/2;let s=0;if(mx!==mn){s=(mx-mn)/(1-Math.abs(2*l-1))}return{l,s}}
function hex(c){return'#'+[c.r,c.g,c.b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function extract(img){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.drawImage(img,0,0,64,64);
  const d=x.getImageData(0,0,64,64).data,m=new Map();
  for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)<<8|(d[i+1]>>4)<<4|(d[i+2]>>4);m.set(k,(m.get(k)||0)+1)}
  const arr=[...m].map(([k,n])=>{const r=((k>>8)&15)*16+8,g=((k>>4)&15)*16+8,b=(k&15)*16+8;const h=hsl(r,g,b);return{r,g,b,n,l:h.l,s:h.s}}).sort((a,b)=>b.n-a.n);
  const bg=arr[0];
  const dist=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.g-b.g)+Math.abs(a.b-b.b);
  let acc=arr.filter(a=>a.l>.2&&a.l<.8&&dist(a,bg)>90).sort((a,b)=>b.n*b.s*b.s-a.n*a.s*a.s)[0]||arr[1]||bg;
  let ink;
  if(bg.l<.5){ink={r:245,g:240,b:230}}
  else{const dk=arr.filter(a=>a.l<.2&&a.n>=4).sort((a,b)=>b.n-a.n)[0];ink=dk||{r:26,g:26,b:26}}
  $('cBg').value=hex(bg);$('cInk').value=hex(ink);$('cAcc').value=hex(acc);
}

/* ---- 描画ヘルパー ---- */
function fitText(t,font,size,maxW,min=24){ // fontは"700 {size}px family"形式の関数
  let s=size;ctx.font=font(s);while(ctx.measureText(t).width>maxW&&s>min){s-=2;ctx.font=font(s)}return s}
function drawPhoto(bx,by,bw,bh){
  ctx.save();ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.clip();
  if(!st.photo){ctx.fillStyle='#222';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#888';ctx.font='32px sans-serif';ctx.textAlign='center';ctx.fillText('写真を選択してください',bx+bw/2,by+bh/2)}
  else{const im=st.photo,s=Math.max(bw/im.width,bh/im.height)*st.zoom;const w=im.width*s,h=im.height*s;
    const mx=(w-bw)/2,my=(h-bh)/2;st.dx=Math.max(-mx,Math.min(mx,st.dx));st.dy=Math.max(-my,Math.min(my,st.dy));
    ctx.drawImage(im,bx+(bw-w)/2+st.dx,by+(bh-h)/2+st.dy,w,h)}
  ctx.restore();
}
function drawLogo(x,y,size){if(!st.logo)return;const im=st.logo,r=Math.min(size/im.width,size/im.height);ctx.drawImage(im,x,y,im.width*r,im.height*r)}
function dateStr(){return $('tDate').value.trim()}
function rows(){const n=+val('n');const r=[];for(let i=0;i<n;i++)r.push([$('l'+i).value,$('n'+i).value]);return r}

let photoBox={x:0,y:0,w:W,h:H};

function lighten(c){const n=parseInt(c.slice(1),16),m=v=>Math.round(v+(255-v)*.4);return'rgb('+m(n>>16)+','+m((n>>8)&255)+','+m(n&255)+')'}
/* ---- A: フル写真 ---- */
function drawRing(){
  const acc=lighten($('cAcc').value),t=($('tTitle').value||'EVENT NAME').toUpperCase(),p=4,maxW=520,maxH=60;
  const off=document.createElement('canvas'),o=off.getContext('2d');
  const font=s=>`800 ${s}px Arial,"Yu Gothic","Meiryo",sans-serif`;
  let s=maxH;o.font=font(s);while(o.measureText(t).width>maxW&&s>16){s-=2;o.font=font(s)}
  const w=Math.ceil(o.measureText(t).width)+8,h=Math.ceil(s*1.2);off.width=w;off.height=h;
  o.font=font(s);o.textBaseline='middle';o.textAlign='center';o.fillStyle='#fff';o.fillText(t,w/2,h/2+s*.04);
  const d=o.getImageData(0,0,w,h).data,cx=541,y0=311+(+$('ringY').value),k=0.000623;
  const pos=(gx,gy)=>{const dx=gx+p/2-w/2,th=Math.atan(2*k*dx),vy=gy+p/2-h/2;return[cx+dx-vy*Math.sin(th),y0+k*dx*dx+vy*Math.cos(th)]};
  const lit=(gx,gy)=>d[(Math.min(h-1,gy+(p>>1))*w+Math.min(w-1,gx+(p>>1)))*4+3]>110;
  ctx.save();ctx.textAlign='left';
  ctx.fillStyle='rgba(255,230,170,.07)';
  for(let gy=0;gy<h;gy+=p)for(let gx=0;gx<w;gx+=p){if(lit(gx,gy))continue;const[X,Y]=pos(gx,gy);ctx.beginPath();ctx.arc(X,Y,p*.28,0,7);ctx.fill()}
  ctx.fillStyle=acc;ctx.shadowColor=acc;ctx.shadowBlur=9;
  for(let gy=0;gy<h;gy+=p)for(let gx=0;gx<w;gx+=p){if(!lit(gx,gy))continue;const[X,Y]=pos(gx,gy);ctx.beginPath();ctx.arc(X,Y,p*.4,0,7);ctx.fill()}
  ctx.restore();
}
function trimAlpha(im){
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;
  for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){if(d[(y*c.width+xx)*4+3]>24){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return im;const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);o.off={x0,y0,ow:im.width,oh:im.height};return o}
function drawStage(anchor){
  if(st.bg){const im=st.bg,s=Math.max(W/im.width,H/im.height);ctx.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s)}
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0a08');g.addColorStop(1,'#2a2112');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#8a7a55';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('背景画像を選んでください',W/2,H/2)}
  const t=+$('tint').value;if(t>0){ctx.save();ctx.globalCompositeOperation='color';ctx.globalAlpha=t;ctx.fillStyle=$('cAcc').value;ctx.fillRect(0,0,W,H);ctx.restore()}
  if($('ring').checked)drawRing();
  const im=st.cut,keep=$('keepTable').checked&&st.photo&&im&&im.off;
  if(keep)anchor-=100;
  if(im){const s=Math.min(W*.98/im.width,(anchor-230)/im.height)*st.zoom,w=im.width*s,h=im.height*s;
    if(keep){const o=im.off,pxs=(W-w)/2+st.dx-o.x0*s,pys=anchor-h+st.dy-o.y0*s,ty=Math.round(o.oh*($('tableY').value/100)),sh=o.oh-ty;
      const pw=Math.ceil(o.ow*s),ph=Math.ceil(sh*s),tb=document.createElement('canvas');tb.width=pw;tb.height=ph;const u=tb.getContext('2d');
      u.drawImage(st.photo,0,ty,o.ow,sh,0,0,pw,ph);u.globalCompositeOperation='destination-in';
      const gr=u.createLinearGradient(0,0,0,ph),t1=Math.min(.3,40/ph);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(t1,'rgba(0,0,0,1)');gr.addColorStop(.72,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');u.fillStyle=gr;u.fillRect(0,0,pw,ph);
      ctx.drawImage(tb,pxs,pys+ty*s)}
    const tc=document.createElement('canvas');tc.width=Math.ceil(w);tc.height=Math.ceil(h);const t=tc.getContext('2d');
    t.drawImage(im,0,0,tc.width,tc.height);t.globalCompositeOperation='destination-in';
    const fade=keep?0.001:Math.min(130,tc.height*.3),g=t.createLinearGradient(0,tc.height-fade,0,tc.height);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
    t.fillStyle=g;t.fillRect(0,0,tc.width,tc.height);
    ctx.drawImage(tc,(W-w)/2+st.dx,anchor-h+st.dy)}
  else if(st.photo){ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='34px sans-serif';ctx.textAlign='center';const m=st.busy?['切り抜き中…']:st.failed?['自動切り抜きできません','「切り抜き済みPNG」を入れてください']:['切り抜き待ち'];m.forEach((t,i)=>ctx.fillText(t,W/2,H/2+i*48))}
}
async function makeCut(){
  if(st.manual||!st.photoFile||st.cutFor===st.photoFile||st.busy)return;
  st.busy=true;status('切り抜き準備中…(初回は1分ほどかかります)');draw();
  try{
    const mod=await import(BGREMOVE);const rb=mod.removeBackground||mod.default;
    const blob=await rb(st.photoFile,{output:{format:'image/png'},progress:(k,c,t)=>status('読込・処理中… '+(t?Math.round(c/t*100)+'%':''))});
    await new Promise(res=>loadImg(blob,im=>{st.cut=trimAlpha(im);st.cutFor=st.photoFile;res()}));
    status('切り抜き完了。ドラッグで位置、バーで大きさを調整できます。');
  }catch(e){st.failed=true;status('切り抜きに失敗しました(ネット接続を確認してください): '+(e&&e.message||e))}
  st.busy=false;draw();
}
function drawA(mode){
  const acc=lighten($('cAcc').value),kind=val('kind');
  const n=kind==='win'?rows().length:1,bh=kind==='win'?(n===1?420:300+n*80):340;
  photoBox={x:0,y:0,w:W,h:H};mode==='S'?drawStage(H-bh+110):drawPhoto(0,0,W,H);
  let g=ctx.createLinearGradient(0,0,0,360);g.addColorStop(0,'rgba(0,0,0,.82)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,360);
  g=ctx.createLinearGradient(0,H-bh,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.45,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,.9)');ctx.fillStyle=g;ctx.fillRect(0,H-bh,W,bh);
  // タイトル
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const ringOn=mode==='S'&&$('ring').checked;
  const sub=$('tSub').value.trim(),dt=dateStr();
  const line=[sub,dt].filter(Boolean).join('  ·  ');
  if(ringOn){
    if(line){ctx.font=`700 34px ${SERIF}`;ctx.fillStyle=acc;ctx.fillText(line,W/2,110)}
  }else{
    const t=$('tTitle').value||'EVENT NAME';
    fitText(t,s=>`700 ${s}px ${CINZEL}`,78,860,32);ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=12;ctx.fillText(t.toUpperCase(),W/2,118);ctx.shadowBlur=0;
    if(line){ctx.font=`700 34px ${SERIF}`;ctx.fillStyle=acc;ctx.fillText(line,W/2,178)}
    ctx.fillStyle=acc;ctx.fillRect(W/2-130,205,260,3);
  }
  drawLogo(W-190,30,150);
  // 下部
  ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=14;
  if(kind==='ft'){
    const f=$('tFt').value||'FINAL TABLE';fitText(f,s=>`700 ${s}px ${CINZEL}`,112,940,40);ctx.fillStyle=acc;ctx.fillText(f.toUpperCase(),W/2,H-110);
  }else{
    const r=rows();
    if(r.length===1){
      ctx.font=`700 54px ${SERIF}`;ctx.fillStyle=acc;ctx.fillText(r[0][0],W/2,H-215);
      fitText(r[0][1]||'NAME',s=>`900 ${s}px ${MINCHO}`,130,940,48);ctx.fillStyle='#fff';ctx.fillText(r[0][1]||'NAME',W/2,H-85);
    }else{
      const lh=r.length===2?130:110,top=H-60-lh*r.length+lh*.72;
      r.forEach((p,i)=>{const y=top+i*lh;
        ctx.font=`700 46px ${SERIF}`;const lw=ctx.measureText(p[0]).width;
        const ns=fitText(p[1]||'NAME',s=>`900 ${s}px ${MINCHO}`,i===0?84:72,700,36);const nw=ctx.measureText(p[1]||'NAME').width;
        const total=lw+36+nw,x0=W/2-total/2;ctx.textAlign='left';
        ctx.font=`700 46px ${SERIF}`;ctx.fillStyle=acc;ctx.fillText(p[0],x0,y);
        ctx.font=`900 ${ns}px ${MINCHO}`;ctx.fillStyle='#fff';ctx.fillText(p[1]||'NAME',x0+lw+36,y);ctx.textAlign='center'});
    }
  }
  ctx.shadowBlur=0;
}

/* ---- B: フレーム ---- */
function diamond(x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();ctx.fill()}
function drawB(){
  const bg=$('cBg').value,ink=$('cInk').value,acc=$('cAcc').value,kind=val('kind');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 薄いスート柄
  ctx.save();ctx.globalAlpha=.09;ctx.fillStyle=acc;ctx.font=`150px ${SERIF}`;ctx.textAlign='center';
  [['♠',110,420],['♣',975,280],['♦',100,820],['♥',985,780]].forEach(([c,x,y])=>ctx.fillText(c,x,y));ctx.restore();
  // 枠
  ctx.strokeStyle=acc;ctx.lineWidth=3;ctx.strokeRect(22,22,W-44,H-44);ctx.lineWidth=1;ctx.strokeRect(34,34,W-68,H-68);
  // 角のリボン
  ctx.fillStyle=acc;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(210,0);ctx.lineTo(0,210);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W,H);ctx.lineTo(W-210,H);ctx.lineTo(W,H-210);ctx.closePath();ctx.fill();
  ctx.globalAlpha=.4;ctx.fillRect(0,0,0,0);ctx.globalAlpha=1;
  // タイトル
  ctx.textAlign='center';ctx.fillStyle=ink;
  const t=$('tTitle').value||'Event Name';
  fitText(t,s=>`800 italic ${s}px ${SERIF}`,84,680,34);ctx.fillText(t,W/2,112);
  const dt=dateStr();if(dt){ctx.font=`700 30px ${SERIF}`;ctx.textAlign='right';ctx.fillText(dt,W-70,70);ctx.textAlign='center'}
  const sub=$('tSub').value.trim();
  if(sub){ctx.fillStyle=acc;fitText(sub,s=>`700 italic ${s}px ${SERIF}`,56,760,30);ctx.fillText(sub,W/2,190)}
  ctx.fillStyle=acc;diamond(W/2,214,7);ctx.fillRect(140,212,W/2-170,2);ctx.fillRect(W/2+30,212,W/2-170,2);
  // 写真
  const bx=88,by=250,bw=W-176,bh=690;photoBox={x:bx,y:by,w:bw,h:bh};
  ctx.fillStyle=acc;ctx.fillRect(bx-6,by-6,bw+12,bh+12);drawPhoto(bx,by,bw,bh);
  // 下部
  const hasLogo=!!st.logo,cx=hasLogo?620:W/2,mw=hasLogo?760:900;
  if(hasLogo)drawLogo(70,1000,170);
  ctx.fillStyle=acc;ctx.fillRect(cx-mw/2+20,968,mw-40,2);diamond(cx,969,6);
  ctx.textAlign='center';
  if(kind==='ft'){
    const f=$('tFt').value||'FINAL TABLE';fitText(f,s=>`800 italic ${s}px ${SERIF}`,110,mw,40);ctx.fillStyle=ink;ctx.fillText(f,cx,1140);
  }else{
    const r=rows();
    if(r.length===1){
      ctx.font=`800 italic 92px ${SERIF}`;ctx.fillStyle=ink;ctx.fillText(r[0][0],cx,1105);
      fitText(r[0][1]||'名前',s=>`900 ${s}px ${MINCHO}`,120,mw,48);ctx.fillStyle=ink;ctx.fillText(r[0][1]||'名前',cx,1240);
    }else{
      const lh=r.length===2?135:105,top=1000+(r.length===2?95:80);
      r.forEach((p,i)=>{const y=top+i*lh;
        ctx.font=`800 italic 50px ${SERIF}`;const lw=ctx.measureText(p[0]).width;
        const ns=fitText(p[1]||'名前',s=>`900 ${s}px ${MINCHO}`,i===0?88:74,mw-lw-50,34);const nw=ctx.measureText(p[1]||'名前').width;
        const x0=cx-(lw+36+nw)/2;ctx.textAlign='left';
        ctx.font=`800 italic 50px ${SERIF}`;ctx.fillStyle=acc;ctx.fillText(p[0],x0,y);
        ctx.font=`900 ${ns}px ${MINCHO}`;ctx.fillStyle=ink;ctx.fillText(p[1]||'名前',x0+lw+36,y);ctx.textAlign='center'});
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);ctx.textBaseline='alphabetic';
  const L=val('layout');L==='B'?drawB():drawA(L);
}

async function fonts(){try{await Promise.all([`700 40px Cinzel`,`800 italic 40px "Playfair Display"`,`700 italic 40px "Playfair Display"`,`900 40px "Zen Old Mincho"`,`700 40px "Zen Old Mincho"`].map(f=>document.fonts.load(f,'Aa日本語')))}catch(e){}draw()}

/* ---- UI ---- */
function sync(){
  $('sBox').classList.toggle('hide',val('layout')!=='S');if(val('layout')==='S')makeCut();
  $('segN').classList.toggle('hide',val('kind')!=='win');
  $('names').classList.toggle('hide',val('kind')!=='win');
  const n=+val('n');for(let i=0;i<3;i++){const on=i<n;$('l'+i).parentElement.style.display=on?'':'none'}
  draw();
}
document.querySelectorAll('input[type=radio]').forEach(e=>e.addEventListener('change',sync));
document.querySelectorAll('input[type=text],input[type=color]').forEach(e=>e.addEventListener('input',draw));
$('fAnn').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],im=>{extract(im);draw()});
$('fBg').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],im=>{st.bg=im;draw()});
$('fCut').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],im=>{st.cut=trimAlpha(im);st.cutFor=st.photoFile||'manual';st.manual=true;st.failed=false;status('切り抜き済み画像を使っています。');draw()});
$('keepTable').onchange=draw;$('tableY').oninput=draw;
$('tint').oninput=draw;$('ring').onchange=draw;$('ringY').oninput=draw;
$('fPhoto').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],im=>{st.photo=im;st.photoFile=e.target.files[0];st.cut=null;st.cutFor=null;st.manual=false;st.failed=false;if(val('layout')==='S')makeCut();st.dx=st.dy=0;st.zoom=1;$('zoom').value=1;draw()});
$('fLogo').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],im=>{st.logo=im;draw()});
$('zoom').oninput=e=>{st.zoom=+e.target.value;draw()};

let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx:st.dx,dy:st.dy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;const k=W/cv.getBoundingClientRect().width;st.dx=drag.dx+(e.clientX-drag.x)*k;st.dy=drag.dy+(e.clientY-drag.y)*k;draw()});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab'});
